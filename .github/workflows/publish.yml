name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact GitHub Release version, with or without the v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: 1.97.0

jobs:
  metadata:
    name: Validate release
    runs-on: ubuntu-24.04
    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate the selected GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          version=${VERSION_INPUT#v}
          test "$VERSION_INPUT" = "$version" || test "$VERSION_INPUT" = "v${version}"
          python3 - "$version" <<'PY'
          import sys
          sys.path.insert(0, "tools/release")
          from release import parse_version
          parse_version(sys.argv[1])
          PY
          tag="v${version}"
          git fetch origin "refs/tags/${tag}:refs/tags/${tag}"
          test "$(git cat-file -t "refs/tags/${tag}")" = tag
          sha=$(git rev-list -n 1 "$tag")
          release=$(gh release view "$tag" --json isDraft,isPrerelease,tagName)
          test "$(jq -r .isDraft <<<"$release")" = false
          test "$(jq -r .tagName <<<"$release")" = "$tag"
          prerelease=false
          if [[ "$version" == *-rc.* ]]; then
            prerelease=true
          fi
          test "$(jq -r .isPrerelease <<<"$release")" = "$prerelease"
          current=$(git show "${tag}:Cargo.toml" | \
            sed -n '/^\[workspace\.package\]$/,/^\[/s/^version = "\([^"]*\)"$/\1/p')
          test "$current" = "$version"
          {
            printf 'version=%s\n' "$version"
            printf 'tag=%s\n' "$tag"
            printf 'sha=%s\n' "$sha"
            printf 'prerelease=%s\n' "$prerelease"
          } >>"$GITHUB_OUTPUT"

  npm:
    name: npm
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain "$RUST_TOOLCHAIN"
          rustup default "$RUST_TOOLCHAIN"
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install the pinned npm release tool
        run: npm install --global npm@11.5.1
      - name: Build and publish the npm package
        env:
          KFIND_COMPONENT_RESOURCE_DIR: ${{ github.workspace }}/dist/component
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          test -n "$NODE_AUTH_TOKEN"
          scripts/build-component-resource.sh dist/component
          pnpm --dir packages/kfind run pack:check
          package_file=$(npm pack ./packages/kfind --json | jq -r '.[0].filename')
          local_shasum=$(sha1sum "$package_file" | awk '{print $1}')
          if remote_shasum=$(npm view "@kfind/kfind@${VERSION}" dist.shasum); then
            test "$local_shasum" = "$remote_shasum"
          else
            npm_tag=latest
            if [[ "$PRERELEASE" == true ]]; then
              npm_tag=next
            fi
            npm publish "$package_file" \
              --access public \
              --provenance \
              --tag "$npm_tag"
          fi
          if [[ "$PRERELEASE" == true ]]; then
            npm dist-tag add "@kfind/kfind@${VERSION}" next
            latest=$(npm view @kfind/kfind dist-tags.latest)
            [[ "$latest" != *-* ]]
          else
            npm dist-tag add "@kfind/kfind@${VERSION}" latest
          fi
          test "$(npm view "@kfind/kfind@${VERSION}" version)" = "$VERSION"
      - name: Verify npm registry consumers
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          consumer_directory=$(mktemp -d)
          cd "$consumer_directory"
          test "$(npx --yes "@kfind/kfind@${VERSION}" --version)" = "kfind ${VERSION}"
          test "$(pnpm dlx "@kfind/kfind@${VERSION}" --version)" = "kfind ${VERSION}"
          corepack enable
          corepack prepare yarn@4.9.2 --activate
          test "$(yarn dlx "@kfind/kfind@${VERSION}" --version)" = "kfind ${VERSION}"

  documentation:
    name: Versioned documentation
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.sha }}
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain "$RUST_TOOLCHAIN"
          rustup default "$RUST_TOOLCHAIN"
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Build the versioned site artifacts
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          pnpm --dir site install --frozen-lockfile
          scripts/build-component-resource.sh dist/component
          KFIND_SITE_BASE_PATH="/versions/${VERSION}" \
            pnpm --dir site run build:versioned
          tools/release/site_archive.py build \
            --version "$VERSION" \
            --root site/build/client \
            --component-resource dist/component/morphology-component-compact.kfc \
            --archive "dist/kfind-site-${VERSION}.tar" \
            --compressed-archive "dist/kfind-site-${VERSION}.tar.gz" \
            --index "dist/kfind-site-${VERSION}.index.json"
      - name: Attach immutable artifacts to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          scripts/upload-release-asset.sh \
            "$TAG" "dist/kfind-site-${VERSION}.tar.gz"
          scripts/upload-release-asset.sh \
            "$TAG" "dist/kfind-site-${VERSION}.index.json"
      - name: Upload and publish the R2 manifest
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          PATH="$PWD/site/node_modules/.bin:$PATH" \
            site/scripts/publish-versioned-site.sh \
              "$VERSION" \
              "dist/kfind-site-${VERSION}.tar" \
              "dist/kfind-site-${VERSION}.index.json"
      - name: Verify the published documentation route
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          url="https://kfind.pages.dev/versions/${VERSION}/"
          for _ in $(seq 1 30); do
            status=$(curl --silent --show-error \
              --output dist/published-site.html \
              --dump-header dist/published-site.headers \
              --write-out '%{http_code}' \
              "$url")
            if [[ "$status" == 200 ]] && \
              grep -Fq "$VERSION" dist/published-site.html && \
              grep -Fiq 'x-robots-tag: noindex' dist/published-site.headers; then
              exit 0
            fi
            sleep 10
          done
          echo "published documentation route is unavailable: $url" >&2
          exit 1

  homebrew:
    name: Homebrew
    needs: metadata
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - name: Download the release formula
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          mkdir -p dist
          gh release download "$TAG" \
            --pattern "kfind-${VERSION}.rb" \
            --dir dist
      - name: Publish the tap formula and bottles
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: scripts/publish-homebrew.sh "$VERSION" "dist/kfind-${VERSION}.rb"
      - name: Verify the Homebrew consumer
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          brew update
          brew install seokminhong/brew/kfind
          test "$(kfind --version)" = "kfind ${VERSION}"
          test "$(kfind --check-data --json | jq -r .status)" = ok
          test "$(kfind --check-data --json | jq -r .component.resource_version)" = "$VERSION"

  chocolatey:
    name: Chocolatey
    needs: metadata
    permissions:
      contents: read
    uses: ./.github/workflows/publish-chocolatey.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
    secrets: inherit
