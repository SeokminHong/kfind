name: Publish Chocolatey

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      CHOCOLATEY_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Exact GitHub Release version, with or without the v prefix
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Verify and publish
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate credentials and prepare the release package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CHOCOLATEY_API_KEY)) {
            throw 'CHOCOLATEY_API_KEY is required.'
          }
          if ($env:RELEASE_VERSION.StartsWith('v')) {
            $env:RELEASE_VERSION = $env:RELEASE_VERSION.Substring(1)
            Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_VERSION=$env:RELEASE_VERSION"
          }
          $packageVersion = (
            & python tools/release/release.py chocolatey-version $env:RELEASE_VERSION | Out-String
          ).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Invalid release version: $env:RELEASE_VERSION"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "PACKAGE_VERSION=$packageVersion"

          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $tag = "v$env:RELEASE_VERSION"
          $packageName = "kfind.$packageVersion.nupkg"
          $package = [System.IO.Path]::GetFullPath("dist/$packageName")
          $releaseAssets = @(
            gh release view $tag `
              --repo $env:GITHUB_REPOSITORY `
              --json assets `
              --jq '.assets[].name'
          )
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release was not found: $tag"
          }
          if ($releaseAssets -contains $packageName) {
            gh release download $tag `
              --repo $env:GITHUB_REPOSITORY `
              --pattern $packageName `
              --dir dist
            if ($LASTEXITCODE -ne 0) {
              throw "Chocolatey package was not downloaded: $packageName"
            }
          } else {
            $archiveName = "kfind-windows-x86_64-$env:RELEASE_VERSION.zip"
            gh release download $tag `
              --repo $env:GITHUB_REPOSITORY `
              --pattern $archiveName `
              --dir dist
            if ($LASTEXITCODE -ne 0) {
              throw "Windows release archive was not downloaded: $archiveName"
            }
            $archive = [System.IO.Path]::GetFullPath("dist/$archiveName")
            $archiveSha256 = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            $packageDirectory = [System.IO.Path]::GetFullPath('dist/chocolatey/package')
            ./scripts/render-chocolatey-package.ps1 `
              -ReleaseVersion $env:RELEASE_VERSION `
              -PackageVersion $packageVersion `
              -ArchiveSha256 $archiveSha256 `
              -OutputDirectory $packageDirectory | Out-Null
            choco pack "$packageDirectory/kfind.nuspec" `
              --output-directory dist `
              --limit-output
            if ($LASTEXITCODE -ne 0) {
              throw "Chocolatey package creation failed with exit code $LASTEXITCODE."
            }
            gh release upload $tag $package `
              --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) {
              throw "Chocolatey package was not attached to release $tag."
            }
          }
          if (-not (Test-Path -LiteralPath $package -PathType Leaf)) {
            throw "Chocolatey package was not downloaded: $package"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "PACKAGE_PATH=$package"
      - name: Test the released package
        shell: pwsh
        run: |
          $arguments = @(
            'install', 'kfind', '--version', $env:PACKAGE_VERSION,
            '--source', ([System.IO.Path]::GetDirectoryName($env:PACKAGE_PATH)),
            '--yes', '--no-progress', '--limit-output'
          )
          if ($env:PACKAGE_VERSION.Contains('-')) {
            $arguments += '--pre'
          }
          & choco @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Local Chocolatey install failed with exit code $LASTEXITCODE."
          }
          $versionOutput = (& kfind --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $versionOutput -ne "kfind $env:RELEASE_VERSION") {
            throw "Unexpected installed kfind version: $versionOutput"
          }
          $dataCheck = (& kfind --check-data --json | Out-String) | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $dataCheck.status -ne 'ok') {
            throw 'Installed Chocolatey package failed the data check.'
          }
          if ($dataCheck.component.resource_version -ne $env:RELEASE_VERSION) {
            throw 'Installed Chocolatey resource version does not match the package.'
          }
      - name: Detect an existing registry version
        id: registry
        shell: pwsh
        run: |
          $uri = "https://community.chocolatey.org/api/v2/package/kfind/$env:PACKAGE_VERSION"
          $registryPackage = [System.IO.Path]::GetFullPath("dist/registry-kfind.$env:PACKAGE_VERSION.nupkg")
          try {
            Invoke-WebRequest -Uri $uri -OutFile $registryPackage
            $exists = $true
          } catch {
            $status = $_.Exception.Response.StatusCode.value__
            if ($status -eq 404) {
              $exists = $false
            } else {
              throw
            }
          }
          if ($exists) {
            $releaseHash = (Get-FileHash $env:PACKAGE_PATH -Algorithm SHA256).Hash
            $registryHash = (Get-FileHash $registryPackage -Algorithm SHA256).Hash
            if ($releaseHash -ne $registryHash) {
              throw 'Chocolatey registry package differs from the GitHub Release asset.'
            }
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "exists=$($exists.ToString().ToLowerInvariant())"
      - name: Publish to the Chocolatey Community Repository
        if: steps.registry.outputs.exists != 'true'
        shell: pwsh
        run: |
          $registryUri = "https://community.chocolatey.org/api/v2/package/kfind/$env:PACKAGE_VERSION"
          $registryPackage = [System.IO.Path]::GetFullPath("dist/registry-kfind.$env:PACKAGE_VERSION.nupkg")
          $releaseHash = (Get-FileHash $env:PACKAGE_PATH -Algorithm SHA256).Hash

          function Test-PublishedPackage {
            Remove-Item -LiteralPath $registryPackage -Force -ErrorAction SilentlyContinue
            try {
              Invoke-WebRequest -Uri $registryUri -OutFile $registryPackage
            } catch {
              $status = $_.Exception.Response.StatusCode.value__
              if ($status -ne 404) {
                Write-Warning "Chocolatey registry check failed: $($_.Exception.Message)"
              }
              return $false
            }

            $registryHash = (Get-FileHash $registryPackage -Algorithm SHA256).Hash
            if ($releaseHash -ne $registryHash) {
              throw 'Chocolatey registry package differs from the GitHub Release asset.'
            }
            return $true
          }

          $lastExitCode = 0
          for ($pushAttempt = 1; $pushAttempt -le 3; $pushAttempt++) {
            & choco push $env:PACKAGE_PATH `
              --source https://push.chocolatey.org/ `
              --api-key $env:CHOCOLATEY_API_KEY `
              --limit-output
            $lastExitCode = $LASTEXITCODE
            if ($lastExitCode -eq 0) {
              exit 0
            }

            Write-Warning "Chocolatey push attempt $pushAttempt failed with exit code $lastExitCode."
            for ($registryAttempt = 1; $registryAttempt -le 3; $registryAttempt++) {
              Start-Sleep -Seconds 20
              if (Test-PublishedPackage) {
                Write-Host 'Chocolatey published the package despite the failed push response.'
                exit 0
              }
            }
          }

          throw "Chocolatey publish failed after 3 attempts; last exit code: $lastExitCode."
      - name: Uninstall the smoke-test package
        if: always()
        shell: pwsh
        run: choco uninstall kfind --yes --no-progress --limit-output
